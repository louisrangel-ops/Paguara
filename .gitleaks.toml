# Escaneo de secretos (CI y pre-commit). Usa las reglas por defecto de gitleaks.
[extend]
useDefault = true

[allowlist]
description = "Datos ficticios del modo demo, documentación y fixtures criptográficos de tests"
paths = [
  '''^public/assets/site-demo\.js$''',
  '''^test/unit/kms\.test\.ts$''',
]
regexes = [
  '''^pedido-[0-9]+-[a-z]+$''',
]
